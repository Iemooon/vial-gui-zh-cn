name: zh-cn Win

on:
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-2025

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.6.x'

    - name: Setup venv
      run: |
        python -m venv venv
        . .\venv\Scripts\activate.ps1
        pip install -r requirements.txt

    - name: Install NSIS
      run: |
        Invoke-WebRequest "https://github.com/vial-kb/vial-deps/releases/download/v1/nsis-3.06.1-setup.exe" -UserAgent "wget" -OutFile nsis-3.06.1-setup.exe
        if ((Get-FileHash nsis-3.06.1-setup.exe -Algorithm sha256).Hash -ne "f60488a676308079bfdf6845dc7114cfd4bbff47b66be4db827b89bb8d7fdc52") { Write-Error 'SHA256 mismatch' }
        Start-Process -FilePath "nsis-3.06.1-setup.exe" -ArgumentList "/S", "/D=C:\Program Files (x86)\NSIS" -NoNewWindow -Wait

    - name: Install Visual C++ Redistributable 2015
      run: |
        Invoke-WebRequest -Uri "https://download.microsoft.com/download/3/2/2/3224B87F-CFA0-4E70-BDA3-3DE650EFEBA5/vcredist_x64.exe" -OutFile "vcredist_x64.exe"
        Start-Process -FilePath "vcredist_x64.exe" -ArgumentList "/install", "/quiet", "/norestart" -Wait
        Remove-Item "vcredist_x64.exe"

    # fbs copies msvcr110.dll into the frozen app and aborts with
    # "Could not find msvcr110.dll on your PATH" if it cannot.  That DLL ships
    # with the *2012* redistributable, which is a different package from the 2015
    # one installed above -- upstream's runners happen to have it, a fork's do
    # not.
    #
    # URL and hash come from Microsoft's own winget manifest for
    # Microsoft.VCRedist.2012.x64 (11.0.61030.0); the download-center links that
    # circulate in CI configs are long dead (they 404).  Verified locally: the
    # payload carries msvcr110.dll/msvcp110.dll, i.e. revision 110, not 120.
    - name: Install Visual C++ Redistributable 2012
      run: |
        $url = "https://download.microsoft.com/download/1/6/B/16B06F60-3B20-4FF2-B699-5E9B7962F9AE/VSU_4/vcredist_x64.exe"
        Invoke-WebRequest -Uri $url -OutFile "vcredist2012_x64.exe"
        $want = "681BE3E5BA9FD3DA02C09D7E565ADFA078640ED66A0D58583EFAD2C1E3CC4064"
        if ((Get-FileHash "vcredist2012_x64.exe" -Algorithm sha256).Hash -ne $want) { Write-Error "SHA256 mismatch" }
        Start-Process -FilePath "vcredist2012_x64.exe" -ArgumentList "/install", "/quiet", "/norestart" -Wait
        Remove-Item "vcredist2012_x64.exe"
        $dll = Get-ChildItem -Path "C:\Windows\System32\msvcr110.dll" -ErrorAction SilentlyContinue
        if (-not $dll) { Write-Error "msvcr110.dll still missing after installing the 2012 redistributable" }
        Write-Host "msvcr110.dll: $($dll.FullName)"

    - name: Build
      run: |
        . .\venv\Scripts\activate.ps1
        fbs freeze
        Compress-Archive -Path "target\Vial" -DestinationPath vial-win.zip

    - uses: actions/upload-artifact@v4
      with:
        name: vial-win
        path: vial-win.zip

    - name: Create installer
      run: |
        $env:Path += ";C:\Program Files (x86)\NSIS"
        . .\venv\Scripts\activate.ps1
        fbs installer

    - uses: actions/upload-artifact@v4
      with:
        name: vial-win-installer
        path: target\VialSetup.exe
