name: zh-cn verify

on:
  workflow_dispatch:

# Temporary: proves the Linux/macOS artifacts carry our translated modules, not
# just a green build.  A green job says nothing about the payload; PyInstaller
# compresses module names inside the PYZ archive, so reading the archive TOC is
# the only way to see them.  Deleted once the result is recorded.

jobs:
  verify-linux:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: vial-linux
        github-token: ${{ secrets.GITHUB_TOKEN }}
        repository: Iemooon/vial-gui-zh-cn
        run-id: 36391210733

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Extract and read the archive TOC
      run: |
        set -e
        chmod +x Vial-x86_64.AppImage
        ./Vial-x86_64.AppImage --appimage-extract > /dev/null
        pip install pyinstaller -q
        python - <<'PY'
        from PyInstaller.archive.readers import CArchiveReader
        r = CArchiveReader("squashfs-root/opt/Vial/Vial")
        print("archive entries:", len(r.toc))
        for name in sorted(r.toc):
            if name.lower().endswith(".pyz"):
                print("  embedded archive:", name)
        pyz = r.open_embedded_archive("PYZ-00.pyz")
        mods = sorted(str(m) for m in pyz.toc)
        print("PYZ modules:", len(mods))
        for m in mods:
            if "i18n" in m.lower():
                print("  * FOUND:", m)
        print("sample:", mods[:12])
        PY
        echo "--- and the packaged qmk settings size ---"
        ls -la squashfs-root/opt/Vial/qmk_settings.json 2>/dev/null || \
          find squashfs-root -name qmk_settings.json -exec ls -la {} \;

  verify-mac:
    runs-on: macos-15
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: vial-mac
        github-token: ${{ secrets.GITHUB_TOKEN }}
        repository: Iemooon/vial-gui-zh-cn
        run-id: 36391207320

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Mount and read the archive TOC
      run: |
        set -e
        hdiutil attach vial-mac.dmg -nobrowse -mountpoint /tmp/vial
        pip install pyinstaller -q
        python - <<'PY'
        from PyInstaller.archive.readers import CArchiveReader
        exe = "/tmp/vial/Vial.app/Contents/MacOS/Vial"
        r = CArchiveReader(exe)
        print("archive entries:", len(r.toc))
        for name in sorted(r.toc):
            if name.lower().endswith(".pyz"):
                print("  embedded archive:", name)
        pyz = r.open_embedded_archive("PYZ-00.pyz")
        mods = sorted(str(m) for m in pyz.toc)
        print("PYZ modules:", len(mods))
        for m in mods:
            if "i18n" in m.lower():
                print("  * FOUND:", m)
        print("sample:", mods[:12])
        PY
