name: zh-cn verify

on:
  workflow_dispatch:

# Temporary: unpacks the Linux/macOS artifacts on their own platform so we can
# prove the translated app is inside instead of trusting a green job.  Deleted
# once the result is recorded.

jobs:
  verify-linux:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: vial-linux
        github-token: ${{ secrets.GITHUB_TOKEN }}
        repository: Iemooon/vial-gui-zh-cn
        run-id: 36391210733

    - name: Extract and inspect the AppImage
      run: |
        set -e
        chmod +x Vial-x86_64.AppImage
        ./Vial-x86_64.AppImage --appimage-extract > /dev/null
        echo "--- frozen app tree (opt/Vial) ---"
        ls -la squashfs-root/opt/Vial/ | head -30
        echo "--- Vial binary ---"
        file squashfs-root/opt/Vial/Vial 2>/dev/null || ls -la squashfs-root/opt/Vial/Vial
        echo "--- the bundled module archive ---"
        ls -la squashfs-root/opt/Vial/*.pyz squashfs-root/opt/Vial/*.zip 2>/dev/null || true
        echo "--- i18n: search the code, not the Qt libs ---"
        find squashfs-root/opt/Vial -name 'libicu*' -prune -o -iname '*i18n*' -print -o -iname 'zh_cn*' -print
        echo "--- does the archive carry our modules? ---"
        for f in squashfs-root/opt/Vial/Vial squashfs-root/opt/Vial/*.pyz; do
          [ -f "$f" ] || continue
          echo "== $f"
          strings -a "$f" | grep -x -e 'i18n' -e 'i18n.zh_cn' -e 'main' | sort -u | head
        done
        echo "--- qt translations present ---"
        ls squashfs-root/opt/Vial/PyQt5/Qt/translations/ 2>/dev/null | head -5
        echo "--- can the frozen app at least start? ---"
        ./squashfs-root/AppRun --version 2>&1 | head -5 || echo "(no --version)"

  verify-mac:
    runs-on: macos-15
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: vial-mac
        github-token: ${{ secrets.GITHUB_TOKEN }}
        repository: Iemooon/vial-gui-zh-cn
        run-id: 36391207320

    - name: Mount the dmg and inspect the bundle
      run: |
        set -e
        hdiutil attach vial-mac.dmg -nobrowse -mountpoint /tmp/vial
        echo "--- volume root ---"
        ls -la /tmp/vial
        echo "--- bundle ---"
        ls -la /tmp/vial/Vial.app/Contents/
        ls -la /tmp/vial/Vial.app/Contents/MacOS/ | head -20
        echo "--- i18n in the payload ---"
        find /tmp/vial/Vial.app -name 'libicu*' -prune -o -iname '*i18n*' -print -o -iname 'zh_cn*' -print | head
        echo "--- archive contents ---"
        strings -a /tmp/vial/Vial.app/Contents/MacOS/Vial 2>/dev/null | grep -x -e 'i18n' -e 'i18n.zh_cn' | sort -u
        echo "--- resources ---"
        ls -la /tmp/vial/Vial.app/Contents/Resources/ 2>/dev/null | head -15
